# 1. Define where the logs should go (Console and File)
handlers=java.util.logging.ConsoleHandler, java.util.logging.FileHandler

# 2. Set the global default logging level
.level=INFO

# 3. Configure the Console Output
java.util.logging.ConsoleHandler.level=ALL
java.util.logging.ConsoleHandler.formatter=java.util.logging.SimpleFormatter
# Make the console output cleaner (removes the 2-line default format)
java.util.logging.SimpleFormatter.format=[%1$tF %1$tT] [%4$-7s] %5$s %n

# 4. Configure the File Output (Replaces your old PrintWriter!)
java.util.logging.FileHandler.level=ALL
# Writes to a folder named .archivesearcher in the user's home directory
java.util.logging.FileHandler.pattern=%h/.archivesearcher/debug.log
# Append to the file rather than overwriting it every time
java.util.logging.FileHandler.append=true
# 5MB limit per file (value is in bytes: 5 * 1024 * 1024 = 5242880)
java.util.logging.FileHandler.limit=5242880
# Keep a maximum of 3 rolling log files
java.util.logging.FileHandler.count=3
java.util.logging.FileHandler.formatter=java.util.logging.SimpleFormatter

# 5. App-Specific Overrides (This is where the magic happens)
# Let's say you only want DEBUG (FINE) logs for your specific package:
nl.rowendu.level=FINE